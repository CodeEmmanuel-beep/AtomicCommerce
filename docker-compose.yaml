services:
  marketplace_db:
    image: postgres:16-alpine
    container_name: marketplace_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-name}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-user} -d ${DB_NAME:-name}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend

  celery_worker:
    build: .
    container_name: celery_worker
    restart: always
    command: celery -A app.utils.celery_app worker --loglevel=info  
    env_file:
      - .env
    depends_on:
      marketplace_db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend

  celery_beat:
    build: .
    container_name: celery_beat
    restart: always
    command: celery -A app.utils.celery_app beat --loglevel=info
    env_file:
      - .env
    depends_on:
      marketplace_db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend

  e_marketplace:
    build: .
    container_name: marketplace_api
    restart: always
    volumes:
      - .:/app
      - ./logs:/app/logs
    expose: 
      - "8000"
    env_file:
      - .env
    depends_on:
      marketplace_db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
  
  nginx:
    image: nginx:alpine
    container_name: marketplace_nginx
    restart: always
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./fullchain.pem:/etc/letsencrypt/live/${DOMAIN_NAME}/fullchain.pem:ro
      - ./privkey.pem:/etc/letsencrypt/live/${DOMAIN_NAME}/privkey.pem:ro
    depends_on:
      - e_marketplace
    networks:
      - backend

networks:
  backend:
    driver: bridge
volumes:
  postgres_data:
